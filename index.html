<!doctype html>
<!-- cutout 在线抠图 · 版本 v1.6.0 · 修正：开始抠图按钮静态图标复刻为 lucide-react Sparkles（中心星 + 四角 4 个小火花，描边白色），与 Manus lucide-react@0.453.0 一致；此前误用单颗实心菱形。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>在线抠图工具</title>
<link rel="stylesheet" href="style.css?v=1.6.0" />
</head>
<body>
<main class="app">
  <header class="app__header">
    <h1 class="app__title">在线抠图工具</h1>
    <p class="app__sub">上传图片，智能去除背景，支持自定义背景</p>
  </header>

  <section class="panel">
    <!-- 上传卡片 -->
    <label id="dropzone" class="dropzone" tabindex="0">
      <input id="fileInput" type="file" accept="image/*" hidden />
      <span class="dropzone__icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#C7A66A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 47a10.5 10.5 0 0 1-1.2-20.9A16.2 16.2 0 0 1 32.4 13c8.2 0 15.1 6.1 16.1 14a10.2 10.2 0 0 1-1.2 20" />
          <path d="M32 50V28m0 0-6.5 6.5M32 28l6.5 6.5" stroke-width="3.6" />
        </svg>
      </span>
      <span class="dropzone__title">点击或拖拽图片到此处上传</span>
      <span class="dropzone__hint">支持 JPG、PNG、WebP 格式，最大 10MB</span>
      <span class="dropzone__file" id="filePill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><circle cx="10" cy="12" r="2"/><path d="m20 16-2.5-2.5L11 20"/></svg>
        <span id="fileName"></span>
      </span>
    </label>

    <!-- 参数配置区 -->
    <div class="options">
      <div class="options__group">
        <span class="options__label">抠图模式</span>
        <div class="seg" role="radiogroup" aria-label="抠图模式">
          <button type="button" class="seg__btn is-active" data-mode="general" role="radio" aria-checked="true">
            <svg class="seg__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
            <span>高清通用</span>
          </button>
          <button type="button" class="seg__btn" data-mode="portrait" role="radio" aria-checked="false">
            <svg class="seg__ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
            <span>快速人像</span>
          </button>
        </div>
      </div>

      <div class="options__group">
        <span class="options__label">选择背景</span>
        <div class="swatches" role="radiogroup" aria-label="背景颜色">
          <div class="swatch-item">
            <div class="swatch is-active" data-bg="transparent" role="radio" aria-checked="true" tabindex="0" title="透明">
              <span class="swatch__fill swatch__fill--transparent"></span>
            </div>
            <span class="swatch__label">透明</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#ffffff" role="radio" aria-checked="false" tabindex="0" title="白色">
              <span class="swatch__fill" style="background:#ffffff;"></span>
            </div>
            <span class="swatch__label">白色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#171c26" role="radio" aria-checked="false" tabindex="0" title="黑色">
              <span class="swatch__fill" style="background:#171c26;"></span>
            </div>
            <span class="swatch__label">黑色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#f4434a" role="radio" aria-checked="false" tabindex="0" title="红色">
              <span class="swatch__fill" style="background:#f4434a;"></span>
            </div>
            <span class="swatch__label">红色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#2878F0" role="radio" aria-checked="false" tabindex="0" title="蓝色">
              <span class="swatch__fill" style="background:#2878F0;"></span>
            </div>
            <span class="swatch__label">蓝色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#34be8b" role="radio" aria-checked="false" tabindex="0" title="绿色">
              <span class="swatch__fill" style="background:#34be8b;"></span>
            </div>
            <span class="swatch__label">绿色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch" data-bg="#f6c548" role="radio" aria-checked="false" tabindex="0" title="黄色">
              <span class="swatch__fill" style="background:#f6c548;"></span>
            </div>
            <span class="swatch__label">黄色</span>
          </div>
          <div class="swatch-item">
            <div class="swatch swatch--grad" data-bg="gradient" role="radio" aria-checked="false" tabindex="0" title="渐变">
              <span class="swatch__fill swatch__fill--gradient"></span>
            </div>
            <span class="swatch__label">渐变</span>
          </div>
          <div class="swatch-item">
            <div class="swatch swatch--custom" data-bg="custom" role="radio" aria-checked="false" tabindex="0" title="自定义">
              <input id="customColor" class="swatch__input" type="color" value="#d3b06c" />
              <span class="swatch__fill swatch__fill--custom">
                <svg class="swatch__pip" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5l-7 7"/><path d="M12 12L9 9l-5 7 3 3 7-5z"/></svg>
              </span>
            </div>
            <span class="swatch__label">自定义</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 开始抠图 -->
    <button id="cutBtn" class="btn btn--primary" type="button" disabled>
      <svg class="btn__ic btn__ic--spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      <svg class="btn__ic btn__ic--spin" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <span id="cutBtnText">开始抠图</span>
    </button>

    <!-- 进度反馈：始终显示，无任务时提示上传，有任务时显示进度文案 -->
    <div class="progress" id="progress">
      <div class="progress__track"><div id="progressBar" class="progress__bar"></div></div>
      <div class="progress__text" id="progressText">请上传图片后开始本地抠图</div>
    </div>
  </section>

  <!-- 结果预览 -->
  <section class="result" id="result" hidden>
    <div class="result__head">
      <h2 class="result__title">抠图结果预览</h2>
      <span class="result__bg" id="bgType">透明背景</span>
    </div>
    <div class="result__cols">
      <div class="result__col">
        <span class="result__tag result__tag--orig">原图</span>
        <div class="result__stage result__stage--orig"><img id="origImg" alt="原图" /></div>
      </div>
      <div class="result__col">
        <span class="result__tag result__tag--cut">抠图结果</span>
        <div class="result__stage result__stage--cut">
          <img id="resultImg" alt="抠图结果" />
          <button id="downloadBtn" class="result__dl" type="button" title="下载结果" aria-label="下载结果">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <footer class="app__footer">
    <div class="app__footer-main">
      <p>图片全程在浏览器本地处理，不会上传到任何服务器。</p>
    </div>
    <p id="ver"></p>
  </footer>
</main>
<script type="module" src="app.js?v=1.6.0"></script>
</body>
</html>
